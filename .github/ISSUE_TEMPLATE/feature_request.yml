name: Feature request
description: Propose a product or analytical capability
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable outcomes.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Data ingestion and profiling
        - Analysis capability
        - Workflow runtime
        - Model and inference
        - UI and usability
        - Observability and evaluation
        - Security and privacy
        - Documentation
