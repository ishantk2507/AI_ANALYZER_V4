name: Bug report
description: Report a reproducible defect in AI Analyzer
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include private datasets, secrets, credentials, or sensitive prompts."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps and a synthetic example where possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, backend, model, quantization, context size.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include run ID and diagnostic code; redact paths and data.
